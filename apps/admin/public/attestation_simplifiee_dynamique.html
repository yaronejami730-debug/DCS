<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Attestation simplifiée d’accord</title>
    <style>
      :root {
        --vert: #5b8a72;
        --vert-doux: #eaf2ec;
        --bleu-gris: #5a6b7b;
        --bleu-gris-clair: #eef1f4;
        --beige: #f6f2e9;
        --beige-bord: #e7dfcd;
        --encre: #2c3a33;
        --ligne: #cbd3cd;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: #e9ece9;
        color: var(--encre);
        font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.5;
      }

      /* ---------- Barre d’édition (écran seulement) ---------- */
      .editeur {
        max-width: 820px;
        margin: 24px auto;
        background: #fff;
        border: 1px solid var(--beige-bord);
        border-radius: 14px;
        padding: 20px 22px;
        box-shadow: 0 6px 22px rgba(44, 58, 51, 0.08);
      }

      .editeur h1 {
        margin: 0 0 4px;
        font-size: 19px;
        color: var(--vert);
      }

      .editeur p.sous {
        margin: 0 0 18px;
        color: var(--bleu-gris);
        font-size: 13.5px;
      }

      .rangee {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-bottom: 16px;
      }

      select,
      input[type="text"] {
        font: inherit;
        padding: 9px 11px;
        border: 1px solid var(--ligne);
        border-radius: 9px;
        background: #fff;
        color: var(--encre);
        outline: none;
      }

      select:focus,
      input[type="text"]:focus {
        border-color: var(--vert);
        box-shadow: 0 0 0 3px var(--vert-doux);
      }

      button {
        font: inherit;
        cursor: pointer;
        border: none;
        border-radius: 9px;
        padding: 9px 14px;
        font-weight: 600;
        transition: filter 0.15s ease;
      }

      button:hover {
        filter: brightness(0.96);
      }

      .btn-vert {
        background: var(--vert);
        color: #fff;
      }

      .btn-gris {
        background: var(--bleu-gris-clair);
        color: var(--bleu-gris);
      }

      .btn-retirer {
        background: #f7e9e7;
        color: #a6483c;
        padding: 7px 11px;
        font-size: 13px;
      }

      .btn-imprimer {
        background: var(--vert);
        color: #fff;
        padding: 12px 20px;
        font-size: 15px;
      }

      .liste-docs {
        border-top: 1px solid var(--beige-bord);
        margin-top: 6px;
        padding-top: 14px;
      }

      .ligne-doc {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        padding: 10px;
        border: 1px solid var(--beige-bord);
        border-radius: 10px;
        margin-bottom: 10px;
        background: var(--beige);
      }

      .ligne-doc .num {
        font-weight: 700;
        color: var(--vert);
        min-width: 34px;
      }

      .ligne-doc input[type="text"] {
        flex: 1;
        min-width: 180px;
      }

      .approbation {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--bleu-gris);
        white-space: nowrap;
      }

      .vide {
        color: var(--bleu-gris);
        font-size: 13.5px;
        padding: 8px 2px;
      }

      .barre-imprimer {
        text-align: right;
        margin-top: 18px;
      }

      /* ---------- Pages A4 ---------- */
      .pages {
        max-width: 820px;
        margin: 0 auto 40px;
      }

      .page {
        background: #fff;
        width: 210mm;
        min-height: 297mm;
        margin: 0 auto 20px;
        padding: 24mm 20mm;
        box-shadow: 0 6px 22px rgba(44, 58, 51, 0.1);
        page-break-after: always;
        break-after: page;
        display: flex;
        flex-direction: column;
      }

      .page:last-child {
        page-break-after: auto;
        break-after: auto;
      }

      /* Page d’introduction */
      .intro-titre {
        font-size: 30px;
        color: var(--vert);
        margin: 0 0 6px;
        letter-spacing: -0.3px;
      }

      .intro-sous {
        color: var(--bleu-gris);
        font-size: 15px;
        margin: 0 0 26px;
        max-width: 62ch;
      }

      .bloc-champs {
        background: var(--beige);
        border: 1px solid var(--beige-bord);
        border-radius: 12px;
        padding: 22px 24px;
        margin-bottom: 22px;
      }

      .champ {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        margin-bottom: 18px;
      }

      .champ:last-child {
        margin-bottom: 0;
      }

      .champ .etq {
        font-size: 14px;
        color: var(--bleu-gris);
        font-weight: 600;
        white-space: nowrap;
      }

      .champ .ligne {
        flex: 1;
        border-bottom: 1.5px dotted var(--ligne);
        min-height: 22px;
      }

      .encadre-vert {
        border-left: 4px solid var(--vert);
        background: var(--vert-doux);
        border-radius: 8px;
        padding: 16px 18px;
        font-size: 14.5px;
        color: var(--encre);
      }

      .note-legale {
        margin-top: auto;
        padding-top: 22px;
        font-size: 12px;
        color: var(--bleu-gris);
        border-top: 1px solid var(--beige-bord);
      }

      .note-legale strong {
        color: var(--vert);
      }

      /* Page document */
      .doc-entete {
        font-size: 20px;
        color: var(--vert);
        border-bottom: 2px solid var(--vert-doux);
        padding-bottom: 10px;
        margin: 0 0 20px;
      }

      .doc-concerne {
        font-size: 14px;
        color: var(--bleu-gris);
        font-weight: 600;
        margin-bottom: 14px;
      }

      .doc-corps {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        align-items: stretch;
      }

      .zone-infos {
        border: 1.5px solid var(--ligne);
        border-radius: 10px;
        padding: 14px 16px;
        min-height: 74mm;
        background: #fcfbf7;
      }

      .zone-infos .titre-zone {
        font-size: 12.5px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: var(--bleu-gris);
        font-weight: 700;
        margin-bottom: 10px;
      }

      .zone-infos .ligne-remplir {
        border-bottom: 1px dotted var(--ligne);
        height: 26px;
      }

      .zone-signature {
        border: 2px solid var(--vert);
        border-radius: 10px;
        min-height: 74mm;
        display: flex;
        flex-direction: column;
        background: #fff;
      }

      .zone-signature .titre-sig {
        background: var(--vert);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        text-align: center;
        padding: 9px 12px;
        border-radius: 8px 8px 0 0;
      }

      .zone-signature .espace {
        flex: 1;
      }

      .mention-approbation {
        text-align: center;
        font-size: 13.5px;
        color: var(--bleu-gris);
        padding: 10px;
        border-top: 1px dashed var(--ligne);
        font-style: italic;
      }

      .doc-confirmation {
        margin-top: 22px;
        background: var(--bleu-gris-clair);
        border-radius: 8px;
        padding: 14px 16px;
        font-size: 13.5px;
        color: var(--encre);
      }

      .doc-pied {
        margin-top: auto;
        padding-top: 20px;
        border-top: 1px solid var(--beige-bord);
        font-size: 11.5px;
        color: var(--bleu-gris);
      }

      /* ---------- Impression ---------- */
      @media print {
        html,
        body {
          background: #fff;
        }

        .no-print {
          display: none !important;
        }

        .pages {
          max-width: none;
          margin: 0;
        }

        .page {
          margin: 0;
          box-shadow: none;
          width: auto;
          min-height: auto;
          padding: 16mm 15mm;
        }

        /* Jamais de coupure au milieu d’un bloc */
        .bloc-champs,
        .encadre-vert,
        .doc-corps,
        .zone-infos,
        .zone-signature,
        .doc-confirmation,
        .note-legale {
          break-inside: avoid;
          page-break-inside: avoid;
        }
      }

      @page {
        size: A4;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <!-- ================= Éditeur (écran) ================= -->
    <section class="editeur no-print">
      <h1>Attestation simplifiée d’accord</h1>
      <p class="sous">
        Ajoutez les documents concernés : une page imprimable est générée pour chacun.
      </p>

      <div class="rangee">
        <select id="type-nouveau" aria-label="Type de document à ajouter">
          <option>Devis</option>
          <option>Facture</option>
          <option>Attestation sur l'honneur</option>
          <option>Mandat ou autorisation</option>
          <option>Autre document</option>
        </select>
        <button class="btn-vert" id="btn-ajouter">Ajouter ce document</button>
      </div>

      <div class="liste-docs" id="liste-docs"></div>

      <div class="barre-imprimer">
        <button class="btn-imprimer" id="btn-imprimer">Imprimer / Enregistrer en PDF</button>
      </div>
    </section>

    <!-- ================= Pages générées ================= -->
    <main class="pages" id="pages"></main>

    <script>
      (function () {
        'use strict';

        var TYPES = [
          'Devis',
          'Facture',
          "Attestation sur l'honneur",
          'Mandat ou autorisation',
          'Autre document',
        ];

        // État : liste de documents. Chaque doc a un type, l’élément concerné et
        // l’option « Lu et approuvé ».
        var documents = [
          { type: 'Devis', concerned: '', showApproval: true },
        ];

        var listeEl = document.getElementById('liste-docs');
        var pagesEl = document.getElementById('pages');

        function escape(str) {
          return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
          });
        }

        // ---------- Rendu de l’éditeur ----------
        function renderEditeur() {
          if (documents.length === 0) {
            listeEl.innerHTML =
              '<p class="vide">Aucun document. Ajoutez-en un pour générer sa page.</p>';
            return;
          }
          listeEl.innerHTML = '';
          documents.forEach(function (doc, i) {
            var ligne = document.createElement('div');
            ligne.className = 'ligne-doc';

            var options = TYPES.map(function (t) {
              return (
                '<option' + (t === doc.type ? ' selected' : '') + '>' + escape(t) + '</option>'
              );
            }).join('');

            ligne.innerHTML =
              '<span class="num">' + (i + 1) + '.</span>' +
              '<select data-i="' + i + '" class="sel-type" aria-label="Type du document ' + (i + 1) + '">' +
              options +
              '</select>' +
              '<input type="text" class="in-concerne" data-i="' + i + '" placeholder="Document concerné (ex. Devis n° 1048)" value="' + escape(doc.concerned) + '" />' +
              '<label class="approbation">' +
              '<input type="checkbox" class="chk-appro" data-i="' + i + '"' + (doc.showApproval ? ' checked' : '') + ' /> Afficher « Lu et approuvé »' +
              '</label>' +
              '<button class="btn-retirer" data-i="' + i + '">Retirer ce document</button>';

            listeEl.appendChild(ligne);
          });
        }

        // ---------- Rendu des pages ----------
        function pageIntro() {
          return (
            '<section class="page">' +
            '<h1 class="intro-titre">Attestation simplifiée d’accord</h1>' +
            '<p class="intro-sous">Ce document nous aide à faciliter l’opération et à éviter de multiplier les formalités. Il réunit, en un seul endroit, votre accord sur les documents concernés — simplement et clairement.</p>' +
            '<div class="bloc-champs">' +
            '<div class="champ"><span class="etq">Je soussigné(e) M./Mme</span><span class="ligne"></span></div>' +
            '<div class="champ"><span class="etq">Qualité du dirigeant</span><span class="ligne"></span></div>' +
            '<div class="champ"><span class="etq">Pour la société</span><span class="ligne"></span></div>' +
            '<div class="champ"><span class="etq">SIREN ou SIRET</span><span class="ligne"></span></div>' +
            '</div>' +
            '<div class="encadre-vert">Je confirme être habilité(e) à engager la société ci-dessus, et avoir lu et accepté les documents listés dans la présente attestation.</div>' +
            '<div class="note-legale">' +
            '<strong>À noter.</strong> Il ne s’agit pas d’une signature électronique : le dirigeant signe manuellement sur cette attestation. Chaque signature manuscrite peut ensuite être photographiée ou numérisée, puis reproduite uniquement sur le document auquel elle correspond, avec son accord exprès. Cette attestation ne remplace pas une formalité obligatoire propre à certains documents ou secteurs.' +
            '</div>' +
            '</section>'
          );
        }

        function pageDocument(doc, index) {
          var mention = doc.showApproval
            ? '<div class="mention-approbation">Mention : « Lu et approuvé »</div>'
            : '';
          return (
            '<section class="page">' +
            '<h2 class="doc-entete">Document ' + (index + 1) + ' — ' + escape(doc.type) + '</h2>' +
            '<p class="doc-concerne">Document concerné : ' +
            (doc.concerned ? escape(doc.concerned) : '__________________________________') +
            '</p>' +
            '<div class="doc-corps">' +
            '<div class="zone-infos">' +
            '<div class="titre-zone">Informations du document concerné</div>' +
            '<div class="ligne-remplir"></div><div class="ligne-remplir"></div><div class="ligne-remplir"></div><div class="ligne-remplir"></div><div class="ligne-remplir"></div><div class="ligne-remplir"></div>' +
            '</div>' +
            '<div class="zone-signature">' +
            '<div class="titre-sig">Signature manuscrite du dirigeant et cachet de la société</div>' +
            '<div class="espace"></div>' +
            mention +
            '</div>' +
            '</div>' +
            '<div class="doc-confirmation">Je confirme avoir lu et accepté le document indiqué ci-dessus. J’autorise la reproduction de la signature présente sur cette page, uniquement sur ce document.</div>' +
            '<div class="doc-pied">Signature manuscrite — non électronique. Reproduction limitée au seul document concerné, avec accord exprès du signataire.</div>' +
            '</section>'
          );
        }

        function renderPages() {
          var html = pageIntro();
          documents.forEach(function (doc, i) {
            html += pageDocument(doc, i);
          });
          pagesEl.innerHTML = html;
        }

        function render() {
          renderEditeur();
          renderPages();
        }

        // ---------- Événements ----------
        document.getElementById('btn-ajouter').addEventListener('click', function () {
          var type = document.getElementById('type-nouveau').value;
          documents.push({ type: type, concerned: '', showApproval: false });
          render();
        });

        document.getElementById('btn-imprimer').addEventListener('click', function () {
          window.print();
        });

        listeEl.addEventListener('input', function (e) {
          var t = e.target;
          var i = Number(t.getAttribute('data-i'));
          if (Number.isNaN(i) || !documents[i]) return;
          if (t.classList.contains('sel-type')) documents[i].type = t.value;
          else if (t.classList.contains('in-concerne')) {
            documents[i].concerned = t.value;
            renderPages(); // maj live des pages sans redessiner l’éditeur (garde le focus)
            return;
          } else if (t.classList.contains('chk-appro')) documents[i].showApproval = t.checked;
          render();
        });

        listeEl.addEventListener('click', function (e) {
          if (!e.target.classList.contains('btn-retirer')) return;
          var i = Number(e.target.getAttribute('data-i'));
          if (Number.isNaN(i)) return;
          documents.splice(i, 1);
          render();
        });

        // ---------- API d’intégration ----------
        // Le système appelle ceci pour générer les pages automatiquement.
        window.setDocuments = function (docs) {
          if (!Array.isArray(docs)) return;
          documents = docs.map(function (d) {
            return {
              type: TYPES.indexOf(d.type) >= 0 ? d.type : d.type || 'Autre document',
              concerned: d.concerned || '',
              showApproval: Boolean(d.showApproval),
            };
          });
          render();
        };

        // Lecture seule de l’état courant, utile au système appelant.
        window.getDocuments = function () {
          return documents.slice();
        };

        render();
      })();
    </script>
  </body>
</html>
